# NOTE: aws credentials need to be mounted to the image user's directory
#       for the process user to have access to the credentials
services:
  server:
    container_name: ne-fgc
    build:
      context: .
    env_file:
      - ./server/.env
    volumes:
      - ~/.aws:/home/node/.aws:ro
    ports:
      - 3000:3000
