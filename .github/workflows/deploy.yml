name: Deploy NE-FGC Main to EC2
  
on:
  push:
    branches:
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPO: ${{ vars.ECR_REPO }}
      IMAGE_TAG: ${{ github.sha }}

    permissions:
      id-token: write
      conntents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with AWS EC2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/Github-NE-FGC-PROD"
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # build, tag, and push with commit hash
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          # Also tag and push as latest
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      - name: Run Deploy Script
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }} ECR_REPO=$ECR_REPO IMAGE_TAG=$IMAGE_TAG CONTAINER_NAME=ne-fgc HOST_PORT=3000 CONTAINER_PORT=3000 ENVIRONMENT=production bash /home/ec2-user/deploy.sh
            ]'
            --query 'Command.CommandId'
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'StatusDetails' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Script failed with status: $STATUS"
            exit 1
          fi
